[project]
name = "ned"
version = "0.0.1"
description = "Ned: a small office robot that listens, talks, and acts. Agent layer."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
  "pipecat-ai[anthropic,cartesia,deepgram,silero]>=1.8.1,<2",
  "numpy>=1.26",
  "loguru>=0.7",
]

[project.optional-dependencies]
# Everything that only makes sense on the Pi (real audio devices, wake word runtime).
pi = [
  "pipecat-ai[local]>=1.8.1,<2",
  "openwakeword>=0.6.0",
  "onnxruntime>=1.17",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[project.scripts]
ned-agent = "ned.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ned"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
